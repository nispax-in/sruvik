name: Build Sruvik APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Prepare stable test signing key
        run: |
          base64 --decode ci/sruvik-test.keystore.base64 > "$RUNNER_TEMP/sruvik-test.jks"

      - name: Build APK
        env:
          SRUVIK_KEYSTORE: ${{ runner.temp }}/sruvik-test.jks
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon :app:assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sruvik-test-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
