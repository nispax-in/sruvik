name: Build Sruvik Debug APK
on:
  push:
    branches: [main, 'fix/**', 'feature/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sruvik-debug-apk-signing
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download pinned Real-ESRGAN model
        run: bash scripts/fetch-upscaler-model.sh
      - name: Restore debug signing key
        uses: actions/cache@v4
        with:
          path: .ci/sruvik-debug.keystore
          key: sruvik-debug-keystore-v2
      - name: Ensure stable debug signing key
        run: |
          mkdir -p .ci
          if [ ! -s .ci/sruvik-debug.keystore ]; then
            keytool -genkeypair -v -keystore .ci/sruvik-debug.keystore -storepass android -alias androiddebugkey -keypass android -dname "CN=Sruvik Debug,O=Nispax,C=IN" -keyalg RSA -keysize 2048 -validity 10000
          fi
          keytool -list -v -keystore .ci/sruvik-debug.keystore -storepass android -alias androiddebugkey | grep "SHA256:"
      - name: Build debug APK
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signer matches persistent key
        shell: bash
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          EXPECTED="$(keytool -list -v -keystore .ci/sruvik-debug.keystore -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/ { gsub(":", "", $2); print tolower($2) }')"
          SIGNER_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"
          printf '%s\n' "$SIGNER_OUTPUT"
          ACTUAL="$(printf '%s\n' "$SIGNER_OUTPUT" | awk '/certificate SHA-256 digest:/ { print tolower($NF); exit }')"
          echo "Keystore SHA-256: $EXPECTED"
          echo "APK signer SHA-256: $ACTUAL"
          test -n "$EXPECTED" && test "$ACTUAL" = "$EXPECTED"
      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: sruvik-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30