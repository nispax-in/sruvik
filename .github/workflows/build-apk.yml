name: Build Sruvik Debug APK (recovered stable signer)
on:
  push:
    branches: ['fix/upscaler-image-selection-feedback']
permissions:
  contents: read
concurrency:
  group: sruvik-debug-apk-signing
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out gallery source
        uses: actions/checkout@v4
        with:
          ref: feature/model-library-gallery
          submodules: true
      - name: Verify and stage pinned Nezumi Kiln MNN runtime
        shell: bash
        run: |
          set -euo pipefail
          EXPECTED_COMMIT="78ea304dd1f0b2082d73f33b1283948c2fdd8e21"
          ACTUAL_COMMIT="$(git -C third_party/nezumi-ai rev-parse HEAD)"
          test "$ACTUAL_COMMIT" = "$EXPECTED_COMMIT"
          verify_blob() {
            local relative="$1" expected="$2" actual
            actual="$(git -C third_party/nezumi-ai hash-object "$relative")"
            test "$actual" = "$expected"
          }
          verify_blob "app/src/main/jniLibs/arm64-v8a/libMNN.so" "3f916ec7eef28e1c9cd4a7a5297b13628cc91b51"
          verify_blob "app/src/main/jniLibs/arm64-v8a/libmnn_sd_engine.so" "658cd3ceade4b149b7da7ecf955f44b3a53e5c76"
          verify_blob "app/src/main/jniLibs/arm64-v8a/libmnn_sd_jni.so" "a0579fd698b844e687c73ec80525d947a26f2c7d"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          cp third_party/nezumi-ai/app/src/main/jniLibs/arm64-v8a/libMNN.so app/src/main/jniLibs/arm64-v8a/
          cp third_party/nezumi-ai/app/src/main/jniLibs/arm64-v8a/libmnn_sd_engine.so app/src/main/jniLibs/arm64-v8a/
          cp third_party/nezumi-ai/app/src/main/jniLibs/arm64-v8a/libmnn_sd_jni.so app/src/main/jniLibs/arm64-v8a/
          mkdir -p app/src/main/assets/third_party/nezumi-ai
          cp third_party/nezumi-ai/LICENSE.md third_party/nezumi-ai/LGPL_LICENSE third_party/nezumi-ai/NOTICE app/src/main/assets/third_party/nezumi-ai/
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Download pinned Real-ESRGAN model
        run: bash scripts/fetch-upscaler-model.sh
      - name: Restore build-101 signing key from its original branch cache
        uses: actions/cache@v4
        with:
          path: .ci/sruvik-debug.keystore
          key: sruvik-debug-keystore-v2
      - name: Verify recovered build-101 signing key
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci
          test -s .ci/sruvik-debug.keystore || { echo "Original signing key cache was not restored; refusing to generate a replacement." >&2; exit 1; }
          EXPECTED="e143f659dd482479778f1da8812d5c8b5b988c420ca580e7915d5c2e893455fe"
          ACTUAL="$(keytool -list -v -keystore .ci/sruvik-debug.keystore -storepass android -alias androiddebugkey | awk -F': ' '/SHA256:/ { gsub(":", "", $2); print tolower($2) }')"
          echo "Expected build-101 signer: $EXPECTED"
          echo "Recovered signer: $ACTUAL"
          test "$ACTUAL" = "$EXPECTED"
      - name: Build gallery APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Verify APK signer matches build 101
        shell: bash
        run: |
          set -euo pipefail
          APK="app/build/outputs/apk/debug/app-debug.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          EXPECTED="e143f659dd482479778f1da8812d5c8b5b988c420ca580e7915d5c2e893455fe"
          SIGNER_OUTPUT="$("$APKSIGNER" verify --print-certs "$APK" 2>&1)"
          printf '%s\n' "$SIGNER_OUTPUT"
          ACTUAL="$(printf '%s\n' "$SIGNER_OUTPUT" | awk '/certificate SHA-256 digest:/ { print tolower($NF); exit }')"
          test "$ACTUAL" = "$EXPECTED"
      - name: Upload compatible APK
        uses: actions/upload-artifact@v4
        with:
          name: sruvik-build101-compatible-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
# Trigger a build for the updated SruGen native workspace.
