name: Upscaler quality checks

on:
  push:
    branches: ['feature/upscaler-gpu-workbench']
  pull_request:
    branches: ['feature/srugen-android-ui-pro-final']

permissions:
  contents: read

concurrency:
  group: upscaler-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-quality:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          submodules: false

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Run JVM regression tests and compile Android tests
        run: gradle --no-daemon :app:testDebugUnitTest :app:compileDebugAndroidTestKotlin
